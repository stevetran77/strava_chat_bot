<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>COROS Chat</title>
    <script>
      // Apply the saved or system theme before the first paint, so the page never flashes the wrong colours.
      try {
        var saved = localStorage.getItem("coros-chat-theme");
        var light = saved ? saved === "light" : window.matchMedia("(prefers-color-scheme: light)").matches;
        document.documentElement.dataset.theme = light ? "light" : "dark";
      } catch (e) { document.documentElement.dataset.theme = "dark"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
